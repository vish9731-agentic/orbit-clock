name: Ringing atmosphere screenshots
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ringing-atmospheres.yml'
      - 'tools/capture-ringing-atmospheres.py'
      - 'core/src/main/java/dev/orbit/clock/core/RingAtmosphere.java'
      - 'core/src/main/java/dev/orbit/clock/core/RingAtmosphereDrawable.kt'
      - 'core/src/main/java/dev/orbit/clock/core/RingActivity.kt'
permissions:
  contents: read
jobs:
  capture:
    if: ${{ github.event_name != 'push' || contains(github.event.head_commit.message, '[ui:atmospheres]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: python -m pip install pillow
      - name: Build phone UI
        run: ./gradlew --no-daemon :phone:assembleDebug
      - name: Prepare runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk
          sudo chmod 666 /dev/kvm
      - name: Verify seven atmospheres and eight real snoozes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -feature -Vulkan
          disable-animations: false
          emulator-boot-timeout: 360
          script: |
            adb shell settings put global device_provisioned 1
            adb shell settings put secure user_setup_complete 1
            adb shell pm disable-user --user 0 com.google.android.googlesdksetup || true
            adb shell am force-stop com.google.android.apps.nexuslauncher
            adb shell setprop debug.hwui.renderer skiagl
            adb install phone/build/outputs/apk/debug/phone-debug.apk
            adb shell pm grant dev.orbit.clock android.permission.POST_NOTIFICATIONS
            adb shell appops set dev.orbit.clock SCHEDULE_EXACT_ALARM allow
            adb shell appops set dev.orbit.clock USE_FULL_SCREEN_INTENT allow
            adb logcat -c
            python tools/capture-ringing-atmospheres.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ringing-atmospheres
          retention-days: 3
          path: atmosphere-screenshots/
