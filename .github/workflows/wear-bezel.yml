name: Wear OS ringing and bezel UI verification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'core/src/main/java/dev/orbit/clock/core/RingActivity.kt'
      - 'core/src/main/java/dev/orbit/clock/core/AlarmSlideControl.kt'
      - 'core/src/main/java/dev/orbit/clock/core/WatchArcControl.kt'
      - 'core/src/main/java/dev/orbit/clock/core/WatchRingTransition.kt'
      - 'core/src/main/res/values/watch_exit_styles.xml'
      - 'core/src/main/AndroidManifest.xml'
      - 'core/src/main/java/dev/orbit/clock/core/RotaryGesture.java'
      - 'core/src/main/java/dev/orbit/clock/core/RingingService.kt'
      - 'core/src/main/java/dev/orbit/clock/core/Scheduler.kt'
      - 'core/src/main/java/dev/orbit/clock/core/RingControls.kt'
      - 'tools/wear-bezel/**'
      - '.github/workflows/wear-bezel.yml'
  push:
    branches: [main]
    paths:
      - 'core/src/main/java/dev/orbit/clock/core/RingActivity.kt'
      - 'core/src/main/java/dev/orbit/clock/core/AlarmSlideControl.kt'
      - 'core/src/main/java/dev/orbit/clock/core/WatchArcControl.kt'
      - 'core/src/main/java/dev/orbit/clock/core/WatchRingTransition.kt'
      - 'core/src/main/res/values/watch_exit_styles.xml'
      - 'core/src/main/AndroidManifest.xml'
      - 'core/src/main/java/dev/orbit/clock/core/RotaryGesture.java'
      - 'core/src/main/java/dev/orbit/clock/core/RingingService.kt'
      - 'core/src/main/java/dev/orbit/clock/core/Scheduler.kt'
      - 'core/src/main/java/dev/orbit/clock/core/RingControls.kt'
      - 'tools/wear-bezel/**'
      - '.github/workflows/wear-bezel.yml'
permissions:
  contents: read
jobs:
  wear-bezel:
    name: wear-bezel (${{ matrix.density }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        density: ['default', '378']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Build watch app and separate UI test APK
        run: |
          ./gradlew --no-daemon :wear:assembleDebug
          bash tools/wear-bezel/build-probe.sh
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Install image feedback dependency
        run: python -m pip install pillow
      - name: Verify round watch UI and rotary events
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: android-wear
          arch: x86_64
          profile: wearos_large_round
          disable-animations: false
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -memory 2048
          script: |
            mkdir -p wear-bezel-results
            adb shell settings put global device_provisioned 1
            adb shell settings put secure user_setup_complete 1
            adb shell settings put secure user_setup_pairing 1
            adb shell dumpsys battery unplug
            adb shell dumpsys battery set status 3
            adb shell dumpsys battery set level 80
            adb shell settings put system screen_off_timeout 1800000
            if [ "${{ matrix.density }}" != "default" ]; then adb shell wm density "${{ matrix.density }}"; fi
            adb shell settings put global window_animation_scale 1
            adb shell settings put global transition_animation_scale 1
            adb shell settings put global animator_duration_scale 1
            adb shell input keyevent 224
            adb install wear/build/outputs/apk/debug/wear-debug.apk
            adb install build/wear-bezel-probe/probe.apk
            adb shell pm grant dev.orbit.clock android.permission.POST_NOTIFICATIONS
            adb logcat -c
            adb shell am instrument -w -r dev.orbit.clock.bezelprobe/.BezelUiProbe > wear-bezel-results/instrumentation.txt
            cat wear-bezel-results/instrumentation.txt
            adb pull /sdcard/Android/data/dev.orbit.clock/files/bezel-results wear-bezel-results/
            adb logcat -d -b crash > wear-bezel-results/crashes.txt
            python tools/wear-bezel/contact_sheet.py
            python -c "from pathlib import Path; s=Path('wear-bezel-results/instrumentation.txt').read_text(); assert 'bezelChecksPassed=true' in s and 'INSTRUMENTATION_CODE: -1' in s, s"
            python -c "from pathlib import Path; s=Path('wear-bezel-results/crashes.txt').read_text(); assert 'Process: dev.orbit.clock' not in s, s"
      - name: Save internal watch verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wear-bezel-results-${{ matrix.density }}
          retention-days: 3
          path: wear-bezel-results/
