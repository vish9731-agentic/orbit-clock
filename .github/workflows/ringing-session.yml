name: Persistent ringing controls and media resume
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'core/src/main/java/dev/orbit/clock/core/Ringing*'
      - 'core/src/main/java/dev/orbit/clock/core/RingActivity.kt'
      - 'core/src/main/java/dev/orbit/clock/core/ClockActivity.kt'
      - 'core/src/main/res/values/themes.xml'
      - 'phone/src/main/AndroidManifest.xml'
      - 'tools/ringing-session/**'
      - 'tools/media-focus/**'
      - '.github/workflows/ringing-session.yml'
permissions:
  contents: read
jobs:
  native:
    if: ${{ github.event_name != 'push' || contains(github.event.head_commit.message, '[ui:ringing-session]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: python -m pip install pillow imageio-ffmpeg
      - name: Build app and independent verification players
        run: |
          ./gradlew --no-daemon -Pkotlin.compiler.execution.strategy=in-process :phone:assembleDebug
          bash tools/media-focus/build-probe.sh
          bash tools/ringing-session/build-probe.sh
      - name: Prepare emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk
          sudo chmod 666 /dev/kvm
      - name: Verify persistent controls and media at normal and large text
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          heap-size: 256M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 2048
          disable-animations: false
          emulator-boot-timeout: 360
          script: |
            adb shell settings put global device_provisioned 1
            adb shell settings put secure user_setup_complete 1
            adb shell pm disable-user --user 0 com.google.android.googlesdksetup || true
            adb shell am force-stop com.google.android.apps.nexuslauncher
            adb shell wm size 720x1600
            adb shell wm density 280
            adb shell settings put system haptic_feedback_enabled 0
            adb shell svc power stayon true
            adb install phone/build/outputs/apk/debug/phone-debug.apk
            adb install media-probe-build/media-focus-probe.apk
            adb install build/ringing-session-probe/probe.apk
            adb shell pm grant dev.orbit.clock android.permission.POST_NOTIFICATIONS
            adb shell pm grant dev.orbit.focusprobe android.permission.POST_NOTIFICATIONS
            adb shell appops set dev.orbit.clock SCHEDULE_EXACT_ALARM allow
            adb shell appops set dev.orbit.clock USE_FULL_SCREEN_INTENT ignore
            adb shell settings put system font_scale 1.0
            mkdir -p session-feedback
            adb logcat -c
            adb shell am instrument -w -e scale 100 dev.orbit.clock.sessionprobe/dev.orbit.clock.sessionprobe.SessionProbe > session-feedback/evidence-100.txt
            adb exec-out run-as dev.orbit.clock tar -C files -cf - session-feedback > session-feedback/frames-100.tar || true
            adb exec-out screencap -p > session-feedback/display-100.png || true
            adb logcat -d -b crash > session-feedback/crashes-100.txt
            python -c "from pathlib import Path; s=Path('session-feedback/evidence-100.txt').read_text(); print(s); assert 'RINGING_SESSION_RESULT_PASS' in s and 'RINGING_SESSION_FAILURE' not in s"
            adb shell am force-stop dev.orbit.clock
            adb shell pm clear dev.orbit.clock
            adb shell pm grant dev.orbit.clock android.permission.POST_NOTIFICATIONS
            adb shell appops set dev.orbit.clock SCHEDULE_EXACT_ALARM allow
            adb shell appops set dev.orbit.clock USE_FULL_SCREEN_INTENT ignore
            adb shell settings put system font_scale 1.3
            adb shell am instrument -w -e scale 130 dev.orbit.clock.sessionprobe/dev.orbit.clock.sessionprobe.SessionProbe > session-feedback/evidence-130.txt
            adb exec-out run-as dev.orbit.clock tar -C files -cf - session-feedback > session-feedback/frames-130.tar || true
            adb exec-out screencap -p > session-feedback/display-130.png || true
            adb logcat -d -b crash > session-feedback/crashes-130.txt
            python -c "from pathlib import Path; s=Path('session-feedback/evidence-130.txt').read_text(); print(s); assert 'RINGING_SESSION_RESULT_PASS' in s and 'RINGING_SESSION_FAILURE' not in s"
            python -c "from pathlib import Path; s='\n'.join(p.read_text() for p in Path('session-feedback').glob('crashes-*.txt')); assert 'FATAL EXCEPTION' not in s and 'Fatal signal' not in s, s"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ringing-session-feedback
          retention-days: 3
          path: session-feedback/
