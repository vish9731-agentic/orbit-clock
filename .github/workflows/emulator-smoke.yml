name: Android emulator smoke test
on:
  workflow_dispatch:
    inputs:
      scope:
        description: UI verification scope
        type: choice
        default: full
        options:
          - full
          - ringing-motion
          - motion
          - guidance
          - visual-cue
  push:
    branches: [main]
    paths:
      - '.github/workflows/emulator-smoke.yml'
      - 'core/**'
      - 'phone/**'
      - 'wear/**'
      - 'tools/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
permissions:
  contents: read
jobs:
  emulator:
    env:
      ORBIT_UI_SCOPE: ${{ inputs.scope || (contains(github.event.head_commit.message, '[ui:visual-cue]') && 'visual-cue') || (contains(github.event.head_commit.message, '[ui:ringing-motion]') && 'ringing-motion') || (contains(github.event.head_commit.message, '[ui:motion]') && 'motion') || (contains(github.event.head_commit.message, '[ui:guidance]') && 'guidance') || 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Build phone APK
        run: ./gradlew --no-daemon :phone:assembleDebug
      - name: Free disk space for emulator userdata
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk
          df -h /
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Install UI inspection dependency
        run: python -m pip install pillow imageio-ffmpeg
      - name: Install and launch on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 360
          script: |
            mkdir -p emulator-results
            adb shell settings put global device_provisioned 1
            adb shell settings put secure user_setup_complete 1
            adb shell pm disable-user --user 0 com.google.android.googlesdksetup || true
            adb shell am force-stop com.google.android.googlesdksetup
            adb install phone/build/outputs/apk/debug/phone-debug.apk
            adb shell pm grant dev.orbit.clock android.permission.POST_NOTIFICATIONS
            adb shell appops set dev.orbit.clock SCHEDULE_EXACT_ALARM allow
            adb logcat -c
            adb shell am start -W -n dev.orbit.clock/dev.orbit.clock.phone.MainActivity > emulator-results/launch.txt
            python tools/emulator_ui_check.py --scope "$ORBIT_UI_SCOPE"
            sleep 2
            adb shell pidof dev.orbit.clock > emulator-results/pid.txt
            adb logcat -d -b crash > emulator-results/crashes.txt
            adb shell screencap -p /sdcard/orbit.png
            adb pull /sdcard/orbit.png emulator-results/screenshot.png
            test -s emulator-results/pid.txt
            test ! -s emulator-results/crashes.txt
      - name: Save launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-results
          retention-days: 3
          path: emulator-results/
