name: Focus phone and watch verification
on:
  workflow_dispatch:
  push:
    paths: ['core/**', 'tools/focus/**', '.github/workflows/focus.yml']
  pull_request:
    paths: ['core/**', 'tools/focus/**', '.github/workflows/focus.yml']
concurrency:
  group: focus-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  focus:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: phone
            api: 35
            target: google_apis
            profile: pixel_6
          - module: wear
            api: 33
            target: android-wear
            profile: wearos_large_round
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and check both apps
        run: |
          bash tools/test-core.sh
          ./gradlew --no-daemon :core:testDebugUnitTest :phone:assembleDebug :wear:assembleDebug :phone:lintDebug :wear:lintDebug
          bash tools/focus/build-probe.sh
      - name: Prepare emulator capacity
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk
          sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -memory 2048
          script: |
            mkdir -p focus-results
            adb shell settings put global device_provisioned 1
            adb shell settings put secure user_setup_complete 1
            adb shell settings put secure user_setup_pairing 1
            adb shell dumpsys battery unplug
            adb shell dumpsys battery set status 3
            adb shell settings put system screen_off_timeout 1800000
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            adb install ${{ matrix.module }}/build/outputs/apk/debug/${{ matrix.module }}-debug.apk
            adb install build/focus-probe/probe.apk
            adb shell pm grant dev.orbit.clock android.permission.POST_NOTIFICATIONS
            adb shell appops set dev.orbit.clock SCHEDULE_EXACT_ALARM allow
            adb logcat -c
            adb shell am instrument -w dev.orbit.clock.focusprobe/dev.orbit.clock.focusprobe.FocusProbe | tee focus-results/checks.txt
            grep -q 'PASS .* Focus runtime checks' focus-results/checks.txt
            adb shell run-as dev.orbit.clock cat files/focus-results/focus.png > focus-results/focus.png
            adb logcat -d -b crash > focus-results/crashes.txt
            test ! -s focus-results/crashes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focus-${{ matrix.module }}
          path: focus-results
          retention-days: 3
