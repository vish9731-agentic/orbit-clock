name: Android debug builds and tests
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test production timing and bezel policies
        run: bash tools/test-core.sh
      - name: Build debug apps, run unit tests and lint
        run: ./gradlew --no-daemon :core:testDebugUnitTest :phone:assembleDebug :wear:assembleDebug :phone:lintDebug :wear:lintDebug
      - name: Upload both debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: orbit-clock-debug-apks
          path: |
            phone/build/outputs/apk/debug/*.apk
            wear/build/outputs/apk/debug/*.apk
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-lint-reports
          path: |
            core/build/reports/tests/
            phone/build/reports/lint-results-debug.*
            wear/build/reports/lint-results-debug.*
  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: orbit-clock-debug-apks
          path: apks
      - name: Make APK filenames clear
        run: |
          mkdir -p downloads
          cp apks/phone/build/outputs/apk/debug/phone-debug.apk downloads/orbit-clock-phone-debug.apk
          cp apks/wear/build/outputs/apk/debug/wear-debug.apk downloads/orbit-clock-watch-debug.apk
      - name: Publish downloadable debug APKs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view debug-latest >/dev/null 2>&1; then
            gh release create debug-latest --target "${{ github.sha }}" --title "Latest debug build" --prerelease --notes "Development builds for testing on your phone and watch. Install the matching pair."
          fi
          gh release upload debug-latest downloads/*.apk --clobber
          gh release edit debug-latest --notes "Debug build ${{ github.run_number }} from commit ${{ github.sha }}. Install the matching phone and watch APKs."
