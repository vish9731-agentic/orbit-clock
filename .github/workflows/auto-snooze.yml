name: Auto snooze and aligned deadlines
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'core/src/main/java/dev/orbit/clock/core/Scheduler.kt'
      - 'core/src/main/java/dev/orbit/clock/core/RingingService.kt'
      - 'core/src/main/java/dev/orbit/clock/core/SnoozeDuration.java'
      - 'tools/auto-snooze/**'
      - '.github/workflows/auto-snooze.yml'
permissions:
  contents: read
jobs:
  capture:
    if: ${{ github.event_name != 'push' || contains(github.event.head_commit.message, '[ui:auto-snooze]') }}
    name: Clock auto-snooze
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Build phone UI
        run: |
          ./gradlew --no-daemon -Pkotlin.compiler.execution.strategy=in-process :phone:assembleDebug
          bash tools/auto-snooze/build-probe.sh
      - name: Prepare runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk
          sudo chmod 666 /dev/kvm
          free -m
      - name: Verify real 30-second auto-snooze and aligned deadlines
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          heap-size: 256M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 2048
          disable-animations: false
          emulator-boot-timeout: 360
          script: |
            adb shell settings put global device_provisioned 1
            adb shell settings put secure user_setup_complete 1
            adb shell pm disable-user --user 0 com.google.android.googlesdksetup || true
            adb shell am force-stop com.google.android.apps.nexuslauncher
            adb shell pm disable-user --user 0 com.google.android.settings.intelligence || true
            adb shell wm size 720x1600
            adb shell wm density 280
            adb shell settings put system haptic_feedback_enabled 0
            adb shell svc power stayon true
            adb install phone/build/outputs/apk/debug/phone-debug.apk
            adb shell pm grant dev.orbit.clock android.permission.POST_NOTIFICATIONS
            adb shell appops set dev.orbit.clock SCHEDULE_EXACT_ALARM allow
            adb shell appops set dev.orbit.clock USE_FULL_SCREEN_INTENT allow || true
            adb logcat -c
            adb install build/auto-snooze-probe/probe.apk
            adb shell am instrument -w dev.orbit.clock.autoprobe/dev.orbit.clock.autoprobe.AutoSnoozeProbe > auto-snooze-evidence.txt
            python -c "from pathlib import Path; s=Path('auto-snooze-evidence.txt').read_text(); print(s); assert 'AUTO_SNOOZE_RESULT_PASS' in s and 'AUTO_SNOOZE_FAILURE' not in s"
      - name: Runner resource diagnostics
        if: always()
        run: |
          free -m
          sudo dmesg --level=err,warn || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auto-snooze-evidence
          retention-days: 3
          path: auto-snooze-evidence.txt
